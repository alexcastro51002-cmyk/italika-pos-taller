services:
  svas:
    build: .
    container_name: svas-app
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      SVAS_DB_PATH: /app/data/svas.db
      SVAS_JWT_SECRET: ${SVAS_JWT_SECRET:-svas-docker-local-secret}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
